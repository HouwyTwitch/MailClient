name: linux

# Linux (Astra Linux SE 1.7/1.8, Debian, Ubuntu) build: tests, self-contained publish, .deb package,
# installation and start in clean Debian 12 (base of Astra Linux 1.8) and Debian 10 (base of Astra Linux 1.7)
# containers; a GitHub Release gets the package for version tags.

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Avalonia collects anonymous build statistics unless this is set.
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        run: |
          # A tag v1.2.3 releases 1.2.3; other builds keep the version from Directory.Build.props.
          base=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; else version="$base"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "FILE_VERSION=$version.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Version $version"
      - name: Test (mail engine)
        run: dotnet test --project tests/MailClient.Tests -c Release
      - name: Test (Linux client, headless)
        run: dotnet test --project tests/MailClient.Linux.Tests -c Release
      - name: Publish
        run: >
          dotnet publish src/MailClient.Linux -c Release -r linux-x64 --self-contained true
          -p:Version=${{ env.VERSION }} -p:FileVersion=${{ env.FILE_VERSION }}
          -o publish/linux-x64
      - name: Package
        run: |
          bash packaging/linux/build-deb.sh "$VERSION" publish/linux-x64 publish
          cd publish && sha256sum mailclient_*.deb > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mailclient-linux-${{ env.VERSION }}
          path: |
            publish/mailclient_*.deb
            publish/SHA256SUMS-linux.txt

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12 (Astra Linux 1.8)
            image: debian:12
          - name: debian-10 (Astra Linux 1.7)
            image: debian:10
    name: install-test ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mailclient-linux-*
          merge-multiple: true
      - name: Repositories
        run: |
          # Debian 10 is out of support: its packages live on archive.debian.org.
          if grep -q buster /etc/os-release; then
            echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
            echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          fi
          apt-get update
      - name: Install the package (dependencies from the distribution)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./mailclient_*.deb xvfb xauth
          DEBIAN_FRONTEND=noninteractive apt-get install -y gdb || echo "gdb unavailable"
      - name: Start
        shell: bash
        run: |
          set -o pipefail
          mailclient --version
          dpkg -l | grep -i "webkit2gtk\|libgtk-3-0\|bubblewrap" | awk '{print $2, $3}' || true
          echo "== text mode (no WebKitGTK)"
          MAILCLIENT_NO_WEBVIEW=1 xvfb-run -a mailclient --smoke-test | tee smoke-text.txt
          grep -q "smoke-test: окно открыто" smoke-text.txt
          echo "== with WebKitGTK"
          if xvfb-run -a mailclient --smoke-test 2>&1 | tee smoke.txt; then
            grep -q "smoke-test: окно открыто" smoke.txt
            exit 0
          fi
          echo "== crashed. Same without the WebKit sandbox:"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a mailclient --smoke-test 2>&1 | tail -20 || true
          echo "== native backtrace:"
          command -v gdb && xvfb-run -a gdb -batch -ex "handle SIGUSR1 SIGUSR2 SIG34 SIG35 SIGPIPE nostop noprint" -ex run -ex "bt 40" -ex "info threads" --args /opt/mailclient/mailclient --smoke-test 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -120
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, install-test ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mailclient-linux-*
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Windows workflow may have created the release already.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Корпоративная почта ${GITHUB_REF_NAME#v}" --generate-notes ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" mailclient_*.deb SHA256SUMS-linux.txt --clobber
