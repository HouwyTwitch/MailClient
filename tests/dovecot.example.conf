base_dir = /srv/mc-imaptest/run
log_path = /srv/mc-imaptest/dovecot.log
protocols = imap
listen = 127.0.0.1
ssl = yes
ssl_cert = </srv/mc-imaptest/srv.crt
ssl_key = </srv/mc-imaptest/srv.key
disable_plaintext_auth = no
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /srv/mc-imaptest/users
}
userdb {
  driver = passwd-file
  args = /srv/mc-imaptest/users
}
mail_location = maildir:~/Maildir
service imap-login {
  inet_listener imap {
    port = 11143
  }
  inet_listener imaps {
    port = 11993
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}
default_internal_user = dovecot
default_login_user = dovenull
